[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdesk"
version = "9.0.0"
description = "Unified Indian market data downloader, no-code strategy builder, and backtesting engine"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "streamlit>=1.50",
    "pandas>=3.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "nest_asyncio>=1.6",
    "pandas-ta>=0.4.67b0",
    "plotly>=6.0",
    "Backtesting>=0.6.5",
    "ta>=0.11",
    "numpy>=2.0",
    "scipy>=1.14",
    "optuna>=4.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "pyarrow>=18.0",
    "psutil>=6.0",
    "hurst>=0.0.5",
    "hmmlearn>=0.3.0",
    "statsmodels>=0.14",
    "quantstats>=0.0.81",
]

[project.optional-dependencies]
openalgo = ["flask>=3.0"]

[project.scripts]
quantdesk-live = "quantdesk.live.signal_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantdesk*"]
